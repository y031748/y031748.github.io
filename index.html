<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#141220">
<meta name="description" content="y031748의 게임과 프로젝트 모음">
<title>y031748</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Karla:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f2ec;
    --bg-raised: #ffffff;
    --ink: #1c1a22;
    --muted: #6a6674;
    --line: rgba(28, 26, 34, 0.12);
    --accent: #6a4bd6;
    --accent-soft: rgba(106, 75, 214, 0.1);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14121a;
      --bg-raised: #1c1926;
      --ink: #f1eef8;
      --muted: #a29dbb;
      --line: rgba(241, 238, 248, 0.12);
      --accent: #9c85f2;
      --accent-soft: rgba(156, 133, 242, 0.14);
    }
  }
  :root[data-theme="dark"] {
    --bg: #14121a;
    --bg-raised: #1c1926;
    --ink: #f1eef8;
    --muted: #a29dbb;
    --line: rgba(241, 238, 248, 0.12);
    --accent: #9c85f2;
    --accent-soft: rgba(156, 133, 242, 0.14);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Karla", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    line-height: 1.7;
    display: flex; justify-content: center;
    padding: 72px 20px 100px;
  }
  .wrap { width: 100%; max-width: 640px; }
  h1 {
    font-family: "Space Grotesk", sans-serif; font-weight: 600;
    font-size: clamp(28px, 6vw, 38px); margin: 0 0 10px;
    letter-spacing: -0.01em;
  }
  p.lede { color: var(--muted); font-size: 15.5px; margin: 0 0 48px; max-width: 46ch; }

  .grid { display: flex; flex-direction: column; gap: 14px; }
  .card {
    display: flex; align-items: center; gap: 16px;
    background: var(--bg-raised); border: 1px solid var(--line);
    border-radius: 14px; padding: 18px 20px;
    text-decoration: none; color: inherit;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .card:hover { transform: translateY(-2px); border-color: var(--accent); }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .card .emoji {
    flex: none; width: 46px; height: 46px; border-radius: 11px;
    background: var(--accent-soft); display: flex; align-items: center; justify-content: center;
    font-size: 22px;
  }
  .card .body { flex: 1; min-width: 0; }
  .card .name {
    font-family: "Space Grotesk", sans-serif; font-weight: 600; font-size: 16.5px;
  }
  .card .desc { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
  .card .arrow { flex: none; color: var(--muted); font-size: 18px; }

  footer { margin-top: 56px; font-size: 12.5px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <h1>y031748</h1>
  <p class="lede">만들고 있는 게임과 프로젝트들.</p>

  <div class="grid">
    <a class="card" href="./bone-rising/">
      <span class="emoji">🦴</span>
      <span class="body">
        <div class="name">Bone Rising</div>
        <div class="desc">맨주먹으로 시작해 전설의 용사로 진화하는 탭 RPG</div>
      </span>
      <span class="arrow">→</span>
    </a>

    <a class="card" href="./twist-drill/">
      <span class="emoji">🥁</span>
      <span class="body">
        <div class="name">빙글 드릴</div>
        <div class="desc">손목을 비틀어 좁은 틈을 아슬아슬하게 통과하는 반응 아케이드</div>
      </span>
      <span class="arrow">→</span>
    </a>

    <a class="card" href="./news-briefing/">
      <span class="emoji">📰</span>
      <span class="body">
        <div class="name">뉴스브리핑</div>
        <div class="desc">매일 자동으로 정리되는 관심 키워드 뉴스</div>
      </span>
      <span class="arrow">→</span>
    </a>
  </div>

  <footer>y031748.github.io</footer>
</div>
</body>
</html>
